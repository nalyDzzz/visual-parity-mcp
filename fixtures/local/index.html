<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local fixture</title>
  <style>
    :root { font-family: Arial, ui-sans-serif, system-ui, sans-serif; color: #111827; background: #f8fafc; }
    body { margin: 0; }
    header { height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 48px; background: #ffffff; border-bottom: 1px solid #d1d5db; }
    .logo { font-weight: 800; font-size: 22px; letter-spacing: -0.02em; }
    nav { display: flex; gap: 24px; font-size: 14px; }
    .hero { padding: 72px 48px 96px; background: linear-gradient(135deg, #f5f3ff, #eff6ff); }
    h1 { max-width: 720px; margin: 0; font-size: 56px; line-height: 1.05; letter-spacing: -0.04em; }
    p { max-width: 600px; font-size: 18px; line-height: 1.55; color: #475569; }
    .cta { display: inline-flex; margin-top: 18px; padding: 14px 24px; border-radius: 8px; background: #4338ca; color: white; text-decoration: none; font-weight: 800; }
  </style>
</head>
<body>
  <header>
    <div class="logo">Next Local</div>
    <nav><a>Product</a><a>Pricing</a><a>About</a></nav>
  </header>
  <main>
    <section class="hero">
      <h1>Migration QA with useful evidence</h1>
      <p>This is the local fixture. It intentionally differs from the live fixture so the smoke test has something useful to report.</p>
      <a class="cta" href="#">Get started</a>
    </section>
  </main>
</body>
</html>
