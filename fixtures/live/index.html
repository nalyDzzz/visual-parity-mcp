<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live fixture</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #111827; background: #f8fafc; }
    body { margin: 0; }
    header { height: 88px; display: flex; align-items: center; justify-content: space-between; padding: 0 72px; background: #ffffff; border-bottom: 1px solid #e5e7eb; }
    .logo { font-weight: 900; font-size: 24px; letter-spacing: -0.04em; }
    nav { display: flex; gap: 32px; font-size: 15px; }
    .hero { padding: 96px 72px 120px; background: linear-gradient(135deg, #ede9fe, #eff6ff); }
    h1 { max-width: 780px; margin: 0; font-size: 64px; line-height: 0.95; letter-spacing: -0.06em; }
    p { max-width: 640px; font-size: 20px; line-height: 1.6; color: #475569; }
    .cta { display: inline-flex; margin-top: 24px; padding: 16px 28px; border-radius: 999px; background: #4f46e5; color: white; text-decoration: none; font-weight: 800; }
  </style>
</head>
<body>
  <header>
    <div class="logo">HubSpot Original</div>
    <nav><a>Product</a><a>Pricing</a><a>About</a></nav>
  </header>
  <main>
    <section class="hero">
      <h1>Migration QA with visual evidence</h1>
      <p>This is the live fixture. It intentionally differs from the local fixture so the smoke test has something useful to report.</p>
      <a class="cta" href="#">Get started</a>
    </section>
  </main>
</body>
</html>
